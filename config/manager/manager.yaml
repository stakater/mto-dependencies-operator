apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: mto-dependencies-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: mto-dependencies-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: mto-dependencies-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: mto-dependencies-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Charts ship CRDs in templates/, and Helm refuses to upgrade over a CRD it does
      # not own. This stamps Helm ownership onto CRDs left by older installs. It runs
      # before helm-operator starts, so before any release is installed or upgraded.
      # Release names are the fixed CR names MTO creates, in this namespace.
      initContainers:
      - name: adopt-crds
        image: controller:latest
        env:
        - name: RELEASE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          sa=/var/run/secrets/kubernetes.io/serviceaccount
          api=https://kubernetes.default.svc/apis/apiextensions.k8s.io/v1/customresourcedefinitions
          while read -r release crd; do
            patch=$(printf \
              '{"metadata":{"labels":{"app.kubernetes.io/managed-by":"Helm"},"annotations":{"meta.helm.sh/release-name":"%s","meta.helm.sh/release-namespace":"%s"}}}' \
              "$release" "$RELEASE_NAMESPACE")
            code=$(curl -sS -o /tmp/response -w '%{http_code}' \
              --cacert "$sa/ca.crt" \
              -H "Authorization: Bearer $(cat "$sa/token")" \
              -H 'Content-Type: application/merge-patch+json' \
              -X PATCH "$api/$crd" --data "$patch")
            case "$code" in
              200) echo "adopted $crd into $release" ;;
              404) echo "skipped $crd (not installed yet)" ;;
              *) echo "failed to adopt $crd (HTTP $code)"; cat /tmp/response; exit 1 ;;
            esac
          done <<'EOF'
          dex-config-operator clients.auth.stakater.com
          dex-config-operator connectors.auth.stakater.com
          dex-config-operator dexconfigs.auth.stakater.com
          dex-config-operator localusers.auth.stakater.com
          tenant-operator-finops costjobs.finops.stakater.com
          tenant-operator-finops finopsproviders.finops.stakater.com
          tenant-operator-finops offerings.finops.stakater.com
          tenant-operator-finops pricebooks.finops.stakater.com
          tenant-operator-finops subscriptions.finops.stakater.com
          tenant-operator-template-operator-v2 templateinstances.templates.v2.stakater.com
          tenant-operator-template-operator-v2 templates.templates.v2.stakater.com
          EOF
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      containers:
      - args:
          - --leader-elect
          - --leader-election-id=mto-dependencies-operator
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10

      imagePullSecrets:
      - name: saap-dockerconfigjson
