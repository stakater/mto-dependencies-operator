apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: mto-dependencies-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: mto-dependencies-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: mto-dependencies-operator
  replicas: 1
  # Never run two operator pods at once. Releases made by MDO 0.0.14 and 0.0.15
  # still render CRDs from templates/, so during a rolling update the old pod could
  # reconcile after the new pod's initContainer has applied newer CRDs and patch
  # them back to the old schema.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: mto-dependencies-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Helm applies a chart's crds/ only on install, so the CRDs the vendored charts
      # ship are kept current here instead: on each pod start, before helm-operator
      # runs, every crds/*.yaml of each chart that has a CR on the cluster is
      # server-side applied. Helm never owns them, so no release name or namespace
      # is involved. A chart without a CR is skipped; when its CR arrives later Helm
      # creates the CRDs on install and the next pod start brings them current.
      # Any failure fails the pod, which keeps helm-operator from running against
      # CRDs in an unknown state. `make lint` checks that every chart shipping CRDs
      # has an entry in the list below, and that the files are laid out as the name
      # extraction expects (one CRD per file, metadata.name at two-space indent).
      initContainers:
      - name: apply-crds
        image: controller:latest
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          sa=/var/run/secrets/kubernetes.io/serviceaccount
          token=$(cat "$sa/token")
          crds=https://kubernetes.default.svc/apis/apiextensions.k8s.io/v1/customresourcedefinitions
          crs=https://kubernetes.default.svc/apis/dependencies.tenantoperator.stakater.com/v1alpha1
          while read -r plural chart; do
            code=$(curl -sS -o /tmp/response -w '%{http_code}' \
              --cacert "$sa/ca.crt" -H "Authorization: Bearer $token" "$crs/$plural?limit=1")
            [ "$code" = 200 ] || { echo "failed to list $plural (HTTP $code)"; cat /tmp/response; exit 1; }
            # The API server pretty-prints for curl, so allow a space after the colon.
            if grep -qE '"items": ?\[\]' /tmp/response; then
              echo "skipped $chart (no $plural)"
              continue
            fi
            for f in /opt/helm/helm-charts/$chart/crds/*.yaml; do
              name=$(sed -n 's/^  name: *//p' "$f" | head -n1)
              [ -n "$name" ] || { echo "no metadata.name in $f"; exit 1; }
              code=$(curl -sS -o /tmp/response -w '%{http_code}' \
                --cacert "$sa/ca.crt" -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/apply-patch+yaml' \
                -X PATCH "$crds/$name?fieldManager=mto-dependencies-operator&force=true" \
                --data-binary "@$f")
              case "$code" in
                200) echo "updated $name" ;;
                201) echo "created $name" ;;
                *) echo "failed to apply $name (HTTP $code)"; cat /tmp/response; exit 1 ;;
              esac
            done
          done <<'EOF'
          finopsoperators finops-operator
          dexconfigoperators dex-config-operator
          templateoperatorv2s template-operator-v2
          EOF
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      containers:
      - args:
          - --leader-elect
          - --leader-election-id=mto-dependencies-operator
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10

      imagePullSecrets:
      - name: saap-dockerconfigjson
