apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: costjobs.finops.stakater.com
spec:
  group: finops.stakater.com
  names:
    kind: CostJob
    listKind: CostJobList
    plural: costjobs
    singular: costjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.interval
      name: Interval
      type: string
    - jsonPath: .status.lastExecutionStatus
      name: Last Status
      type: string
    - jsonPath: .status.lastExecutionTime
      name: Last Execution
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CostJob is the Schema for the costjobs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CostJobSpec defines the desired state of CostJob.
            properties:
              databaseInitTimeout:
                default: 2m
                description: DatabaseInitTimeout is the timeout for database initialization
                type: string
              databaseInsertTimeout:
                default: 3m
                description: DatabaseInsertTimeout is the timeout for database insert
                  operations
                type: string
              databaseViewsRefreshTimeout:
                description: |-
                  DatabaseViewsRefreshTimeout is retained for API compatibility and has no
                  effect. The cost ingestion job no longer refreshes any database view: the
                  mv_provider_allocations_summary materialized view it used to rebuild on
                  every run had no readers and was dropped in migration 14.

                  Deprecated: no-op. Setting this value changes nothing.
                type: string
              httpClientTimeout:
                default: 90s
                description: HTTPClientTimeout is the timeout for HTTP client requests
                type: string
              interval:
                default: 24h
                type: string
              kubernetesOperationTimeout:
                default: 1m
                description: KubernetesOperationTimeout is the timeout for Kubernetes
                  API operations
                type: string
              openCostFetchTimeout:
                default: 2m
                description: OpenCostFetchTimeout is the timeout for fetching data
                  from OpenCost
                type: string
              resources:
                description: |-
                  Resources overrides compute resources for the generated CronJob's loader container.
                  Setting this replaces the whole block, so a partial value does not inherit the
                  template defaults for the keys it omits. Unset means the operator defaults apply.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              sharding:
                description: |-
                  Sharding splits the OpenCost allocation query into several smaller
                  namespace-filtered queries run in parallel, instead of one cluster-wide
                  query per hour. Set this when the single query times out or exhausts
                  memory on a large cluster. Unset means the single cluster-wide query.
                properties:
                  concurrency:
                    default: 4
                    description: |-
                      Concurrency is how many shard queries are in flight at once. It also bounds
                      the job's peak memory, since that many responses can be held at a time.
                    maximum: 32
                    minimum: 1
                    type: integer
                  namespacesPerShard:
                    default: 25
                    description: |-
                      NamespacesPerShard is the maximum number of namespaces covered by a single
                      OpenCost query. Lower values mean more, smaller requests.
                    minimum: 1
                    type: integer
                type: object
              statusUpdateTimeout:
                default: 1m
                description: StatusUpdateTimeout is the timeout for status update
                  operations
                type: string
              type:
                default: ResourceCostCollection
                description: Type of the cost collection job, e.g., "ResourceCostCollection"
                enum:
                - ResourceCostCollection
                - SubscriptionChargeCollection
                type: string
            required:
            - interval
            type: object
          status:
            description: CostJobStatus defines the observed state of CostJob
            properties:
              executionHistory:
                description: History of the last 10 executions
                items:
                  description: ExecutionRecord represents a single execution attempt
                  properties:
                    duration:
                      description: Duration of the execution
                      type: string
                    error:
                      description: Error message if the execution failed
                      type: string
                    executionTime:
                      description: The time when this execution started
                      format: date-time
                      type: string
                    status:
                      description: Status of the execution (Success, Failed, Error)
                      enum:
                      - Success
                      - Failed
                      - Error
                      type: string
                  required:
                  - executionTime
                  - status
                  type: object
                type: array
              lastExecutionStatus:
                description: Status of the last execution
                enum:
                - Success
                - Failed
                - Error
                - Pending
                type: string
              lastExecutionTime:
                description: Last execution time
                format: date-time
                type: string
              lastSuccessfulExecutionTime:
                description: Last successful execution time
                format: date-time
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

