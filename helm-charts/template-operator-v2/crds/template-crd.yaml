apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: templates.templates.v2.stakater.com
spec:
  group: templates.v2.stakater.com
  names:
    kind: Template
    listKind: TemplateList
    plural: templates
    singular: template
  scope: Namespaced
  versions:
  - name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Template is a reusable blueprint that defines Kubernetes resources which can be
          instantiated multiple times across different namespaces using TemplateInstances.
          Templates are scoped to a provider namespace and contain go templates or Helm charts
          that render into one or more Kubernetes manifests when instantiated.

          Namespace Scope (Provider):
          The Template may only reference other resources in its own namespace.

          Security Implication:
          Anyone who can create a Template in a namespace can expose any resource that the
          template-operator service account is allowed to read within that namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TemplateSpec defines the desired state of Template
            properties:
              gotemplate:
                description: |-
                  Exactly one of `gotemplate` or `helm` must be specified.
                  gotemplate is rendered using Go text/template.
                  It may emit one or more Kubernetes manifests.
                  Sprig functions are also available https://masterminds.github.io/sprig/

                  If a namespace-scoped resource omits the namespace field,
                  it will be created in the TemplateInstance's namespace (consumer namespace),
                  NOT in the 'default' namespace or the Template's namespace.

                  Available context (non-exhaustive):
                  - .parameters : resolved parameter values
                  - .instance   : metadata of the TemplateInstance (name, namespace, labels)
                type: string
              helm:
                description: |-
                  Helm renders a Helm chart instead of a raw Go template.
                  Exactly one of `gotemplate` or `helm` must be specified.
                properties:
                  chart:
                    description: Chart defines where the Helm chart is sourced from.
                    properties:
                      repository:
                        description: |-
                          Repository defines the repository location, chart name, version,
                          and optional authentication.
                        properties:
                          auth:
                            description: |-
                              Auth provides optional authentication credentials.
                              The referenced Secret MUST live in the same namespace as this Template.

                              Supported credential layouts by source type:

                              1. HTTP(S) Helm repositories
                                 - username / password keys
                                 - token key

                              2. OCI registries (oci://)
                                 - username / password
                                 - token
                                 - or standard Docker config (.dockerconfigjson)
                            properties:
                              secretRef:
                                description: SecretRef references a Secret in the
                                  same namespace as the Template.
                                properties:
                                  name:
                                    description: Name of the Secret.
                                    minLength: 1
                                    type: string
                                required:
                                - name
                                type: object
                            required:
                            - secretRef
                            type: object
                          name:
                            description: Name is the chart name within the repository.
                            minLength: 1
                            type: string
                          url:
                            description: |-
                              URL is the repository URL.
                              For HTTP/HTTPS repositories: https://charts.example.com
                              For OCI registries: oci://ghcr.io/org/charts
                            minLength: 1
                            pattern: ^(https?|oci)://
                            type: string
                          version:
                            description: |-
                              Version is the exact chart version to pull (SemVer 2, e.g. "1.2.3").
                              Must follow SemVer 2 (https://semver.org): MAJOR.MINOR.PATCH with
                              optional pre-release and build metadata.
                            minLength: 5
                            pattern: ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
                            type: string
                        required:
                        - name
                        - url
                        - version
                        type: object
                    required:
                    - repository
                    type: object
                  releaseName:
                    description: |-
                      ReleaseName is the Helm release name used during rendering.
                      If omitted, defaults to the TemplateInstance name at render time.
                    maxLength: 53
                    type: string
                  valuesTemplate:
                    description: |-
                      ValuesTemplate is a Go template that renders into YAML used as Helm values.
                      The rendered YAML is parsed and passed as Helm value overrides
                      (merged over the chart's default values.yaml).

                      Available context (same as gotemplate):
                      - .parameters : resolved parameter values
                      - .instance   : metadata of the TemplateInstance (name, namespace, labels)
                    type: string
                  version:
                    default: v4
                    description: |-
                      Version selects the Helm rendering engine.
                      Defaults to "v4" if omitted.
                    enum:
                    - v3
                    - v4
                    type: string
                required:
                - chart
                type: object
              parameters:
                description: |-
                  Parameters define the inputs required to render the template.

                  Rules:
                  - `type` is a hint used for validation/coercion (operator-defined).
                items:
                  description: TemplateParameterDefinition defines a single parameter
                    for the template.
                  properties:
                    name:
                      description: Name is the name of the parameter
                      minLength: 1
                      type: string
                    value:
                      description: |-
                        Option 1 (literal): string|number|bool
                        Value provides a literal parameter value (string, number, or bool).
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              targetNamespaces:
                description: |-
                  TargetNamespaces controls where this Template may be instantiated.

                  Default behavior:
                  If this field is omitted entirely, the Template may ONLY be instantiated
                  in the same namespace as this Template.

                  A namespace is eligible if it matches the explicit list OR the selector.
                properties:
                  explicit:
                    description: |-
                      Explicit defines allowed (and in future, denied) consumer namespaces
                      where this Template may be instantiated.
                    properties:
                      allow:
                        description: Allow permits only the strings listed in Literal.
                        properties:
                          literal:
                            items:
                              type: string
                            type: array
                        type: object
                      deny:
                        description: Deny rejects the strings listed in Literal.
                        properties:
                          literal:
                            items:
                              type: string
                            type: array
                        type: object
                    type: object
                  selector:
                    description: Selector dynamically selects namespaces via labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
            type: object
            x-kubernetes-validations:
            - message: exactly one of gotemplate or helm must be specified
              rule: has(self.gotemplate) != has(self.helm)
          status:
            description: TemplateStatus defines the observed state of Template.
            properties:
              conditions:
                description: |-
                  conditions describe fine-grained validation and availability states
                  following standard Kubernetes condition conventions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the last generation of the Template
                  that has been processed by the controller.
                format: int64
                type: integer
              phase:
                description: |-
                  phase summarizes the overall validation state of the Template.
                  Typical values: Valid, Invalid, Error
                enum:
                - Valid
                - Invalid
                - Error
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

