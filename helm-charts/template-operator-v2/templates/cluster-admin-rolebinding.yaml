{{- if .Values.rbac.clusterAdmin.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "template-operator-v2.fullname" . }}-cluster-admin
  labels:
    {{- include "template-operator-v2.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: {{ include "template-operator-v2.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
