apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: template-operator-v2-template-admin-role
  labels:
  {{- include "template-operator-v2.labels" . | nindent 4 }}
rules:
- apiGroups:
  - templates.v2.stakater.com
  resources:
  - templates
  verbs:
  - '*'
- apiGroups:
  - templates.v2.stakater.com
  resources:
  - templates/status
  verbs:
  - get
