controllerManager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: ghcr.io/stakater/template-operator-v2
      tag: v0.0.1
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  nodeSelector: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 1
  tolerations: []
  topologySpreadConstraints: []
imagePullSecrets: []
kubernetesClusterDomain: cluster.local
ms:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""

rbac:
  # clusterAdmin grants the operator SA the cluster-admin ClusterRole.
  # WARNING: Insecure. For local development and testing only.
  # Never enable in production.
  clusterAdmin:
    enabled: false
  # additionalRules appends extra PolicyRule entries to the manager ClusterRole.
  # Use this to grant the operator access to API groups used by your templates.
  # SECURITY: every read permission granted here is transitively available to
  # any user who can create a TemplateInstance WITHOUT spec.serviceAccountRef —
  # such instances resolve valueFrom parameters with the operator's own identity.
  # Multi-tenant clusters should require serviceAccountRef via admission policy
  # (e.g. Kyverno/OPA) so parameter reads are always scoped to a tenant SA.
  additionalRules: []

# Extra volumes, volume mounts, and environment variables for the manager container.
# Use extraVolumeMounts/extraVolumes to inject custom CA bundles, config files, etc.
# Use extraEnvVars to set additional environment variables (e.g. SSL_CERT_DIR).
extraVolumeMounts: []
extraVolumes: []
extraEnvVars: []
