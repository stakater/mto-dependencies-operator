# An older costjobs.finops.stakater.com schema: no spec.sharding, no status.
# Stands in for the CRD a cluster already has from an earlier finops-operator
# chart, so a test can prove the operator upgrades it in place.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: costjobs.finops.stakater.com
spec:
  group: finops.stakater.com
  names:
    kind: CostJob
    listKind: CostJobList
    plural: costjobs
    singular: costjob
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              interval:
                type: string
            required:
            - interval
