apiVersion: dependencies.tenantoperator.stakater.com/v1alpha1
kind: TemplateOperatorV2
metadata:
  name: templateoperatorv2-test
spec:
  controllerManager:
    manager:
      args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      image:
        repository: ghcr.io/stakater/public/template-operator-v2
        tag: v0.0.7
      resources:
        limits:
          cpu: 500m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 64Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    replicas: 1
  kubernetesClusterDomain: cluster.local
  ms:
    ports:
      - name: https
        port: 8443
        protocol: TCP
        targetPort: 8443
    type: ClusterIP
